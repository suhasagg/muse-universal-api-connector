[project]
name = "muse-universal-api-connector-builder"
version = "1.0.0"
description = "Production-oriented OpenAPI to governed agent-tool connector compiler"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4", "httpx>=0.27", "PyYAML>=6.0", "jsonschema>=4.23", "sqlalchemy>=2.0", "asyncpg>=0.29", "redis>=5.0", "prometheus-client>=0.20", "structlog>=24.2", "cryptography>=43.0"]
[project.optional-dependencies]
dev=["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]
[tool.pytest.ini_options]
pythonpath=["."]
